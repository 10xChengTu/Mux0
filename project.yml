# NOTE: ghostty builds a static library (.a) on macOS, not a dylib.
# Run scripts/build-vendor.sh once to populate Vendor/ghostty/lib/
# before opening the Xcode project. The .a file is gitignored.
name: mux0
options:
  bundleIdPrefix: com.mux0
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  mux0:
    type: application
    platform: macOS
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    sources:
      - path: mux0
        excludes:
          - "**/*.md"
    info:
      path: mux0/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(MUX0_DISPLAY_NAME)
        CFBundleDisplayName: $(MUX0_DISPLAY_NAME)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        NSPrincipalClass: NSApplication
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Fork build: the upstream appcast above belongs to the original author's
        # repo — leaving it live would let an upstream release silently replace
        # this fork on the user's machine. Automatic checks are off AND the feed
        # is empty, and Release is additionally compiled with
        # MUX0_UPDATES_DISABLED, which removes every Sparkle *call site* (no file
        # imports it, so the binary keeps zero undefined Sparkle symbols — see
        # mux0/Update/SparkleBridge.swift). The framework is still linked and
        # embedded, because a package product cannot be attached to a single
        # configuration; these two plist keys are the runtime backstop for that.
        # SUPublicEDKey stays for a future fork-owned feed; nothing reads it while
        # the bridge is a stub.
        SUFeedURL: ""
        SUPublicEDKey: +u/yKnlOyk6VnbdXzn5dVaHMoCzambPTRX0dQNe6PRU=
        SUEnableAutomaticChecks: NO
        SUScheduledCheckInterval: 86400
        ITSAppUsesNonExemptEncryption: NO
        # TCC-protected folders — Mux0 hosts shells that may read/write anywhere
        # the user navigates. Declaring these keeps macOS from showing an
        # unstable generic prompt, and lets grants persist across rebuilds.
        NSDocumentsFolderUsageDescription: "Mux0 needs access so terminal sessions can read and write files in your Documents folder."
        NSDesktopFolderUsageDescription: "Mux0 needs access so terminal sessions can read and write files on your Desktop."
        NSDownloadsFolderUsageDescription: "Mux0 needs access so terminal sessions can read and write files in your Downloads folder."
        NSRemovableVolumesUsageDescription: "Mux0 needs access so terminal sessions can read and write files on removable volumes."
        NSNetworkVolumesUsageDescription: "Mux0 needs access so terminal sessions can read and write files on mounted network volumes."
        # TCC device access — Mux0 hosts shells/dev-mode apps that may request the
        # mic or camera. macOS attributes the child's request to Mux0 (the
        # "responsible process"), so the consent prompt is shown on Mux0's behalf
        # and the grant persists against Mux0. Screen Recording needs no key here;
        # Mux0 just has to be enabled under System Settings › Privacy.
        NSMicrophoneUsageDescription: "Mux0 lets terminal sessions and the apps they launch use the microphone."
        NSCameraUsageDescription: "Mux0 lets terminal sessions and the apps they launch use the camera."
        NSAudioCaptureUsageDescription: "Mux0 lets terminal sessions and the apps they launch capture system audio."
        NSAppleEventsUsageDescription: "Mux0 lets terminal sessions and the apps they launch send automation events to other apps."
    postBuildScripts:
      - name: Copy ghostty resources
        script: |
          set -e
          SRC="${PROJECT_DIR}/Vendor/ghostty/share/ghostty"
          DST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/ghostty"
          if [ -d "$SRC" ]; then
            mkdir -p "$DST"
            rm -rf "$DST"
            cp -R "$SRC" "$DST"
          fi
        basedOnDependencyAnalysis: false
      - name: Copy mux0 agent hooks
        script: |
          rm -rf "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/agent-hooks"
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/agent-hooks"
          cp -R "$SRCROOT/Resources/agent-hooks/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/agent-hooks/"
          chmod +x "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/agent-hooks/"*.sh 2>/dev/null || true

          # --- auto-activate mux0 status hooks by appending to ghostty's shell-integration scripts ---

          _mux0_append_once() {
              # $1: target file  $2: marker  $3: line to append
              local f="$1" marker="$2" line="$3"
              [ -f "$f" ] || return 0
              grep -q "$marker" "$f" 2>/dev/null && return 0
              {
                  echo ""
                  echo "# mux0: auto-load agent status hooks"
                  echo "$line"
              } >> "$f"
          }

          GHOSTTY_DIR="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ghostty/shell-integration"

          # zsh — find which file ghostty ships (different ghostty versions name it differently)
          for candidate in "$GHOSTTY_DIR/zsh/.zshrc" \
                           "$GHOSTTY_DIR/zsh/ghostty-integration" \
                           "$GHOSTTY_DIR/zsh/.zshenv"; do
              _mux0_append_once "$candidate" "MUX0_AGENT_HOOKS_DIR" \
                  '[ -f "$MUX0_AGENT_HOOKS_DIR/bootstrap.zsh" ] && source "$MUX0_AGENT_HOOKS_DIR/bootstrap.zsh"'
          done

          # bash — ghostty typically uses bash-integration / ghostty.bash or an rc-file
          for candidate in "$GHOSTTY_DIR/bash/bash-preexec.sh" \
                           "$GHOSTTY_DIR/bash/ghostty.bash" \
                           "$GHOSTTY_DIR/bash/ghostty-bash-integration.bash"; do
              _mux0_append_once "$candidate" "MUX0_AGENT_HOOKS_DIR" \
                  '[ -f "$MUX0_AGENT_HOOKS_DIR/bootstrap.bash" ] && source "$MUX0_AGENT_HOOKS_DIR/bootstrap.bash"'
          done

          # fish — ghostty drops an auto-loaded conf.d file
          for candidate in "$GHOSTTY_DIR/fish/vendor_conf.d/ghostty-shell-integration.fish" \
                           "$GHOSTTY_DIR/fish/conf.d/ghostty-shell-integration.fish"; do
              _mux0_append_once "$candidate" "MUX0_AGENT_HOOKS_DIR" \
                  'test -f "$MUX0_AGENT_HOOKS_DIR/bootstrap.fish"; and source "$MUX0_AGENT_HOOKS_DIR/bootstrap.fish"'
          done
        basedOnDependencyAnalysis: false
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: mux0/Ghostty/ghostty-bridging-header.h
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/Vendor/ghostty/lib
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Vendor/ghostty/include
        OTHER_LDFLAGS: -lghostty -lc++ -framework Carbon
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        LD_RUNPATH_SEARCH_PATHS: '@executable_path/../Frameworks'
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: mux0/mux0.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "0.8.5"
        # 0.8.4 shipped build 3. Upstream lets CI bump this; this fork is released
        # locally (no GitHub push), so the build number is bumped by hand.
        # 0.8.5 was first shipped as build 4; build 5 is the same app with the
        # install.sh that really notices a running mux0 (see docs/build.md), so a
        # fresh download is tellable apart from the 16:49 package by its SHA256 and
        # by CFBundleVersion. Marketing version stays 0.8.5.
        CURRENT_PROJECT_VERSION: "5"
      configs:
        # Debug 构建用独立 bundle id + display name，让 TCC / LaunchServices /
        # UserDefaults / Sparkle 都按 bundle id 分家，开发实例跟 /Applications
        # 装的正式版本可以并存、互不踩授权记录。
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.mux0.app.dev
          MUX0_DISPLAY_NAME: Mux0 Dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.mux0.app
          MUX0_DISPLAY_NAME: Mux0
          # Fork release: compiles out every Sparkle call site so the app can
          # never reach the upstream appcast (the framework itself stays linked;
          # see the Info.plist note above and mux0/Update/SparkleBridge.swift).
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MUX0_UPDATES_DISABLED
    dependencies:
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: AppKit.framework
      - package: Sparkle
        product: Sparkle

  mux0Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - mux0Tests
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
        # 测试目标链接 mux0 模块时会重新扫描 bridging header，
        # 因此同样需要能解析到 <ghostty.h>。
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Vendor/ghostty/include
    dependencies:
      - target: mux0
